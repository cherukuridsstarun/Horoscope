name: daily-horoscope
on:
  schedule:
    - cron: "0 23 * * *"    # 4:30 AM IST
    - cron: "15 0 * * *"    # 5:45 AM IST backup
    - cron: "0 2 * * *"     # 7:30 AM IST safety net
    - cron: "0 6 * * *"     # 11:30 AM IST, picks up the day's fresh gold rates
  workflow_dispatch:        # "Run workflow" button for testing
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - run: pip install requests beautifulsoup4
      - run: python scrape.py
      - run: |
          git config user.name "horoscope-bot"
          git config user.email "bot@users.noreply.github.com"
          git add today.json
          git commit -m "Taurus $(date -u +%F)" || echo "no change"
          git push
