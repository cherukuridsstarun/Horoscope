name: daily-horoscope
on:
  schedule:
    - cron: "0 23 * * *"    # 4:30 AM IST
    - cron: "15 0 * * *"    # 5:45 AM IST backup
    - cron: "0 2 * * *"     # 7:30 AM IST safety net
    - cron: "15 7 * * *"    # 12:45 PM IST, after IBJA's midday gold rate
    - cron: "0 13 * * *"    # 6:30 PM IST, evening weather reading
    - cron: "0 16 * * *"    # 9:30 PM IST, night weather reading
  workflow_dispatch:        # "Run workflow" button for testing
permissions:
  contents: write
concurrency:
  group: daily-horoscope    # never run two at once
  cancel-in-progress: false
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - run: pip install requests beautifulsoup4 ephem
      - run: python scrape.py
      - run: |
          git config user.name "horoscope-bot"
          git config user.email "bot@users.noreply.github.com"
          git add today.json
          git commit -m "Taurus $(date -u +%F)" || { echo "no change"; exit 0; }
          git pull --rebase
          git push
